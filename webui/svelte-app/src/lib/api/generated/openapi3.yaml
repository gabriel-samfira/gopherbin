openapi: 3.0.0
info:
  description: The GopherBin REST API.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: GopherBin API.
  version: "1.0"
paths:
  /admin/users:
    get:
      operationId: listUsers
      parameters:
        - description: Page number, starting at 1.
          in: query
          name: page
          schema:
            type: integer
        - description: Maximum results per page.
          in: query
          name: max_results
          schema:
            type: integer
      responses:
        "200":
          description: UserListResult
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResult"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "403":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: List all user accounts (admin only).
      tags:
        - admin
    post:
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUserParams"
        description: New user.
        required: true
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Users"
        "400":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "403":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: Create a user account (admin only).
      tags:
        - admin
  "/admin/users/{userID}":
    delete:
      operationId: deleteUser
      parameters:
        - description: Numeric user identifier.
          in: path
          name: userID
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "403":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "404":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: Delete a user account (admin only).
      tags:
        - admin
    get:
      operationId: getUser
      parameters:
        - description: Numeric user identifier.
          in: path
          name: userID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Users"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "403":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "404":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: Fetch a single user account (admin only).
      tags:
        - admin
    put:
      operationId: updateUser
      parameters:
        - description: Numeric user identifier.
          in: path
          name: userID
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserPayload"
        description: User fields to update.
        required: true
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Users"
        "400":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "403":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "404":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: Update a user account (admin only).
      tags:
        - admin
  /auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLoginParams"
        description: Login credentials.
        required: true
      responses:
        "200":
          description: JWTResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWTResponse"
        "400":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: Exchange username/email and password for a JWT token.
      tags:
        - auth
  /first-run:
    post:
      description: >-
        Bootstrap the installation by creating the initial superuser. Only
        succeeds

        while the instance has no superuser; every subsequent call returns 409.
      operationId: firstRun
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUserParams"
        description: Initial superuser.
        required: true
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Users"
        "400":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "409":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      tags:
        - system
  /labels:
    get:
      operationId: listLabels
      responses:
        "200":
          description: LabelVocabulary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelVocabulary"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: The label vocabulary visible to the caller, with usage counts.
      tags:
        - labels
  "/labels/{labelID}":
    delete:
      operationId: deleteLabel
      parameters:
        - description: Numeric label identifier.
          in: path
          name: labelID
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "404":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: Delete a label owned by the caller.
      tags:
        - labels
    put:
      operationId: updateLabel
      parameters:
        - description: Numeric label identifier.
          in: path
          name: labelID
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLabelParams"
        description: Label fields to update.
        required: true
      responses:
        "200":
          description: LabelInfo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelInfo"
        "400":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "404":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: Rename a label or change its custom color.
      tags:
        - labels
  /labels/mine:
    get:
      operationId: listOwnedLabels
      responses:
        "200":
          description: LabelInfoArray
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelInfoArray"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: Labels owned by the caller.
      tags:
        - labels
  /logout:
    get:
      operationId: logout
      responses:
        "200":
          $ref: "#/components/responses/OK"
      summary: Blacklist the caller's current JWT token, ending the session.
      tags:
        - auth
  /me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Users"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: The account record of the authenticated caller.
      tags:
        - users
    put:
      operationId: updateMe
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeSettingsParams"
        description: Settings to update.
        required: true
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Users"
        "400":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: Update the caller's own settings.
      tags:
        - users
  /paste:
    get:
      description: |-
        List pastes visible to the caller, filtered by the optional query
        parameters.
      operationId: listPastes
      parameters:
        - description: Page number, starting at 1.
          in: query
          name: page
          schema:
            type: integer
        - description: Maximum results per page.
          in: query
          name: max_results
          schema:
            type: integer
        - description: Restrict the listing to a scope (e.g. user or team).
          in: query
          name: scope
          schema:
            type: string
        - description: Restrict the listing to a single team.
          in: query
          name: team
          schema:
            type: string
        - description: Comma separated label names the pastes must carry.
          in: query
          name: labels
          schema:
            type: string
      responses:
        "200":
          description: PasteListResult
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasteListResult"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      tags:
        - pastes
    post:
      operationId: createPaste
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Paste"
        description: Paste payload.
        required: true
      responses:
        "200":
          description: Paste
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paste"
        "400":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: Create a new paste. The content is provided base64 encoded.
      tags:
        - pastes
  "/paste/{pasteID}":
    delete:
      operationId: deletePaste
      parameters:
        - description: Paste identifier.
          in: path
          name: pasteID
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "404":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: Delete a paste the caller owns.
      tags:
        - pastes
    get:
      operationId: getPaste
      parameters:
        - description: Paste identifier.
          in: path
          name: pasteID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Paste
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paste"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "404":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: Fetch a single paste the caller is allowed to see.
      tags:
        - pastes
    put:
      operationId: updatePaste
      parameters:
        - description: Paste identifier.
          in: path
          name: pasteID
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePasteParams"
        description: Fields to update.
        required: true
      responses:
        "200":
          description: Paste
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paste"
        "400":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "404":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: Update the mutable fields of an existing paste.
      tags:
        - pastes
  "/paste/{pasteID}/download":
    get:
      operationId: downloadPaste
      parameters:
        - description: Paste identifier.
          in: path
          name: pasteID
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/file"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "404":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: Download the raw paste content as an attachment.
      tags:
        - pastes
  "/paste/{pasteID}/labels":
    put:
      operationId: setPasteLabels
      parameters:
        - description: Paste identifier.
          in: path
          name: pasteID
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasteLabelsParams"
        description: Desired label names.
        required: true
      responses:
        "200":
          description: Paste
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paste"
        "400":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "404":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: Replace the label set attached to a paste.
      tags:
        - pastes
  "/paste/{pasteID}/sharing":
    get:
      operationId: listPasteShares
      parameters:
        - description: Paste identifier.
          in: path
          name: pasteID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PasteShareListResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasteShareListResponse"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "404":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: List the users a paste is shared with.
      tags:
        - pastes
    post:
      operationId: sharePaste
      parameters:
        - description: Paste identifier.
          in: path
          name: pasteID
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserActionRequest"
        description: User to share with (username or email in userID).
        required: true
      responses:
        "200":
          description: TeamMember
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "400":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "404":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: Grant a user access to a private paste.
      tags:
        - pastes
  "/paste/{pasteID}/sharing/{userID}":
    delete:
      operationId: unsharePaste
      parameters:
        - description: Paste identifier.
          in: path
          name: pasteID
          required: true
          schema:
            type: string
        - description: User identifier.
          in: path
          name: userID
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "404":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: Revoke a user's access to a paste.
      tags:
        - pastes
  "/paste/{pasteID}/transfer":
    post:
      operationId: transferPaste
      parameters:
        - description: Paste identifier.
          in: path
          name: pasteID
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserActionRequest"
        description: Target user.
        required: true
      responses:
        "200":
          description: Paste
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paste"
        "400":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "404":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: Transfer ownership of a paste to another user.
      tags:
        - pastes
  /paste/search:
    get:
      operationId: searchPastes
      parameters:
        - description: Search query.
          in: query
          name: q
          required: true
          schema:
            type: string
        - description: Page number, starting at 1.
          in: query
          name: page
          schema:
            type: integer
        - description: Maximum results per page.
          in: query
          name: max_results
          schema:
            type: integer
        - description: Restrict the search to a scope (e.g. user or team).
          in: query
          name: scope
          schema:
            type: string
        - description: Restrict the search to a single team.
          in: query
          name: team
          schema:
            type: string
        - description: Comma separated label names the pastes must carry.
          in: query
          name: labels
          schema:
            type: string
      responses:
        "200":
          description: PasteListResult
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasteListResult"
        "400":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: Full-text search over the pastes visible to the caller.
      tags:
        - pastes
  "/public/paste/{pasteID}":
    get:
      operationId: publicPasteView
      parameters:
        - description: Paste identifier.
          in: path
          name: pasteID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Paste
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paste"
        "404":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: Fetch a paste that has been marked public, without authentication.
      tags:
        - pastes
  /teams:
    get:
      operationId: listTeams
      parameters:
        - description: Page number, starting at 1.
          in: query
          name: page
          schema:
            type: integer
        - description: Maximum results per page.
          in: query
          name: max_results
          schema:
            type: integer
      responses:
        "200":
          description: TeamListResult
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamListResult"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: List the teams the caller belongs to.
      tags:
        - teams
    post:
      operationId: createTeam
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTeamParams"
        description: Team name and description.
        required: true
      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Teams"
        "400":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: Create a new team owned by the caller.
      tags:
        - teams
  "/teams/{teamName}":
    delete:
      operationId: deleteTeam
      parameters:
        - description: Team name.
          in: path
          name: teamName
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "404":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: Delete a team (owner only).
      tags:
        - teams
    get:
      operationId: getTeam
      parameters:
        - description: Team name.
          in: path
          name: teamName
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Teams"
        "401":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "404":
          description: APIErrorResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      summary: Fetch a team the caller is a member of.
      tags:
        - teams
    put:
      operationId: updateTeam
      parameters:
        - description: Team name.
          in: path
          name: teamName
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:

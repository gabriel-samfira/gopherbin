                        - usage
            transfer_to:
                type: object
                properties:
                    id:
                        type: integer
                    username:
                        type: string
                    email:
                        type: string
                    full_name:
                        type: string
                    status:
                        type: string
                    role:
                        type: string
                    added_by_id:
                        type: integer
                    added_by:
                        type: string
                required:

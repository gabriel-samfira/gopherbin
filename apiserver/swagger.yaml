basePath: /api/v1
consumes:
    - application/json
definitions:
    APIErrorResponse:
        type: object
        properties:
            error:
                type: string
            details:
                type: string
        required:
            - error
            - details
    JWTResponse:
        type: object
        properties:
            token:
                type: string
        required:
            - token
    LabelInfo:
        type: object
        properties:
            id:
                type: integer
            name:
                type: string
            color:
                type: string
            usage:
                type: integer
        required:
            - id
            - name
            - usage
    LabelInfoArray:
        items:
            $ref: '#/definitions/LabelInfo'
        type: array
    LabelVocabulary:
        type: object
        properties:
            personal:
                type: array
                items:
                    type: string
            teams:
                type: array
                items:
                    type: object
                    properties:
                        team:
                            type: string
                        labels:
                            type: array
                            items:
                                type: string
                    required:
                        - team
                        - labels
            colors:
                type: object
                additionalProperties:
                    type: string
        required:
            - personal
            - teams
            - colors
    MeSettingsParams:
        type: object
        properties:
            discoverable:
                type: boolean
    NewTeamParams:
        type: object
        properties:
            name:
                type: string
            description:
                type: string
        required:
            - name
    NewUserParams:
        type: object
        properties:
            email:
                type: string
            username:
                type: string
            full_name:
                type: string
            password:
                type: string
            is_admin:
                type: boolean
            enabled:
                type: boolean
        required:
            - email
            - username
            - full_name
            - password
            - is_admin
            - enabled
    PasswordLoginParams:
        type: object
        properties:
            username:
                type: string
            password:
                type: string
        required:
            - username
            - password
    Paste:
        type: object
        properties:
            id:
                type: integer
            paste_id:
                type: string
            data:
                type: string
                format: byte
            preview:
                type: string
                format: byte
            language:
                type: string
            name:
                type: string
            description:
                type: string
            expires:
                type: string
                format: date-time
            max_accesses:
                type: integer
            access_count:
                type: integer
            public:
                type: boolean
            created_at:
                type: string
                format: date-time
            created_by:
                type: string
            owner:
                type: string
            owner_id:
                type: integer
            team:
                type: string
            metadata:
                type: object
                additionalProperties:
                    type: string
            labels:
                type: array
                items:
                    type: object
                    properties:
                        name:
                            type: string
                        color:
                            type: string
                        scope:
                            type: string
                        team:
                            type: string
                    required:
                        - name
        required:
            - id
            - paste_id
            - language
            - name
            - description
            - public
            - created_at
            - created_by
            - owner
            - owner_id
            - metadata
    PasteLabelsParams:
        type: object
        properties:
            labels:
                type: array
                items:
                    type: string
        required:
            - labels
    PasteListResult:
        type: object
        properties:
            total_pages:
                type: integer
            page:
                type: integer
            pastes:
                type: array
                items:
                    type: object
                    properties:
                        id:
                            type: integer
                        paste_id:
                            type: string
                        data:
                            type: string
                            format: byte
                        preview:
                            type: string
                            format: byte
                        language:
                            type: string
                        name:
                            type: string
                        description:
                            type: string
                        expires:
                            type: string
                            format: date-time
                        max_accesses:
                            type: integer
                        access_count:
                            type: integer
                        public:
                            type: boolean
                        created_at:
                            type: string
                            format: date-time
                        created_by:
                            type: string
                        owner:
                            type: string
                        owner_id:
                            type: integer
                        team:
                            type: string
                        metadata:
                            type: object
                            additionalProperties:
                                type: string
                        labels:
                            type: array
                            items:
                                type: object
                                properties:
                                    name:
                                        type: string
                                    color:
                                        type: string
                                    scope:
                                        type: string
                                    team:
                                        type: string
                                required:
                                    - name
                    required:
                        - id
                        - paste_id
                        - language
                        - name
                        - description
                        - public
                        - created_at
                        - created_by
                        - owner
                        - owner_id
                        - metadata
        required:
            - total_pages
            - page
            - pastes
    PasteShareListResponse:
        type: object
        properties:
            users:
                type: array
                items:
                    type: object
                    properties:
                        id:
                            type: integer
                        username:
                            type: string
                        email:
                            type: string
                        full_name:
                            type: string
                        status:
                            type: string
                        role:
                            type: string
                        added_by_id:
                            type: integer
                        added_by:
                            type: string
                    required:
                        - id
                        - username
                        - email
                        - full_name
        required:
            - users
    SetTeamMemberRoleParams:
        type: object
        properties:
            role:
                type: string
        required:
            - role
    TeamInviteInfo:
        type: object
        properties:
            team_id:
                type: integer
            team_name:
                type: string
            invited_by:
                type: string
        required:
            - team_id
            - team_name
    TeamInviteInfoArray:
        items:
            $ref: '#/definitions/TeamInviteInfo'
        type: array
    TeamLabelGroup:
        type: object
        properties:
            team:
                type: string
            labels:
                type: array
                items:
                    type: string
        required:
            - team
            - labels
    TeamLabelsParams:
        type: object
        properties:
            labels:
                type: array
                items:
                    type: string
        required:
            - labels
    TeamListResult:
        type: object
        properties:
            total_pages:
                type: integer
            page:

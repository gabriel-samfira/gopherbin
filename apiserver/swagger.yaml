                        name:
                            type: string
                        description:
                            type: string
                        owner:
                            type: object
                            properties:
                                id:
                                    type: integer
                                username:
                                    type: string
                                email:
                                    type: string
                                full_name:
                                    type: string
                                status:
                                    type: string
                                role:
                                    type: string
                                added_by_id:
                                    type: integer
                                added_by:
                                    type: string
                            required:
                                - id
                                - username
                                - email
                                - full_name
                        members:
                            type: array
                            items:
                                type: object
                                properties:
                                    id:
                                        type: integer
                                    username:
                                        type: string
                                    email:
                                        type: string
                                    full_name:
                                        type: string
                                    status:
                                        type: string
                                    role:
                                        type: string
                                    added_by_id:
                                        type: integer
                                    added_by:
                                        type: string
                                required:
                                    - id
                                    - username
                                    - email
                                    - full_name
                        my_role:
                            type: string
                        labels:
                            type: array
                            items:
                                type: string
                        label_details:
                            type: array
                            items:
                                type: object
                                properties:
                                    id:
                                        type: integer
                                    name:
                                        type: string
                                    color:
                                        type: string
                                    usage:
                                        type: integer
                                required:
                                    - id
                                    - name
                                    - usage
                        transfer_to:
                            type: object
                            properties:
                                id:
                                    type: integer
                                username:
                                    type: string
                                email:
                                    type: string
                                full_name:
                                    type: string
                                status:
                                    type: string
                                role:
                                    type: string
                                added_by_id:
                                    type: integer
                                added_by:
                                    type: string
                            required:
                                - id
                                - username
                                - email
                                - full_name
                        my_pending_transfer:
                            type: boolean
                        stats:
                            type: object
                            properties:
                                members:
                                    type: integer
                                pending:
                                    type: integer
                                pastes:
                                    type: integer
                                contributors:
                                    type: integer
                            required:
                                - members
                                - pending
                                - pastes
                                - contributors
                        created_at:
                            type: string
                            format: date-time
                    required:
                        - id
                        - name
                        - owner
        required:
            - total_pages
            - page
            - teams
    TeamMember:
        type: object
        properties:
            id:
                type: integer
            username:
                type: string
            email:
                type: string
            full_name:
                type: string
            status:
                type: string
            role:
                type: string
            added_by_id:
                type: integer
            added_by:
                type: string
        required:
            - id
            - username
            - email
            - full_name
    TeamMemberArray:
        items:
            $ref: '#/definitions/TeamMember'
        type: array
    TeamMemberParams:
        type: object
        properties:
            userID:
                type: string
            role:
                type: string
        required:
            - userID
    TeamStats:
        type: object
        properties:
            members:
                type: integer
            pending:
                type: integer
            pastes:
                type: integer
            contributors:
                type: integer
        required:
            - members
            - pending
            - pastes
            - contributors
    TeamTransferInfo:
        type: object
        properties:
            team_id:
                type: integer
            team_name:
                type: string
            from_user:
                type: string
        required:
            - team_id
            - team_name
    TeamTransferInfoArray:
        items:
            $ref: '#/definitions/TeamTransferInfo'
        type: array
    TeamTransferParams:
        type: object
        properties:
            userID:
                type: string
        required:
            - userID
    Teams:
        type: object
        properties:
            id:
                type: integer
            name:
                type: string
            description:
                type: string
            owner:
                type: object
                properties:
                    id:
                        type: integer
                    username:
                        type: string
                    email:
                        type: string
                    full_name:
                        type: string
                    status:
                        type: string
                    role:
                        type: string
                    added_by_id:
                        type: integer
                    added_by:
                        type: string
                required:
                    - id
                    - username
                    - email
                    - full_name
            members:
                type: array
                items:
                    type: object
                    properties:
                        id:
                            type: integer
                        username:
                            type: string
                        email:
                            type: string
                        full_name:
                            type: string
                        status:
                            type: string
                        role:
                            type: string
                        added_by_id:
                            type: integer
                        added_by:
                            type: string
                    required:
                        - id
                        - username
                        - email
                        - full_name
            my_role:
                type: string
            labels:
                type: array
                items:
                    type: string
            label_details:
                type: array
                items:
                    type: object
                    properties:
                        id:
                            type: integer
                        name:
                            type: string
                        color:
                            type: string
                        usage:
                            type: integer
                    required:

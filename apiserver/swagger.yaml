        required:
            - id
            - created_at
            - updated_at
            - email
            - username
            - full_name
            - enabled
            - is_admin
            - is_superuser
            - discoverable
info:
    description: The GopherBin REST API.
    license:
        name: Apache 2.0
        url: https://www.apache.org/licenses/LICENSE-2.0
    title: GopherBin API.
    version: "1.0"
paths:
    /admin/users:
        get:
            operationId: listUsers
            parameters:
                - description: Page number, starting at 1.
                  in: query
                  name: page
                  type: integer
                - description: Maximum results per page.
                  in: query
                  name: max_results
                  type: integer
            responses:
                "200":
                    description: UserListResult
                    schema:
                        $ref: '#/definitions/UserListResult'
                "401":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
                "403":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
            summary: List all user accounts (admin only).
            tags:
                - admin
        post:
            operationId: createUser
            parameters:
                - description: New user.
                  in: body
                  name: Body
                  required: true
                  schema:
                    $ref: '#/definitions/NewUserParams'
                    description: New user.
                    type: object
            responses:
                "200":
                    description: Users
                    schema:
                        $ref: '#/definitions/Users'
                "400":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
                "401":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
                "403":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
            summary: Create a user account (admin only).
            tags:
                - admin
    /admin/users/{userID}:
        delete:
            operationId: deleteUser
            parameters:
                - description: Numeric user identifier.
                  in: path
                  name: userID
                  required: true
                  type: string
            responses:
                "200":
                    $ref: '#/responses/OK'
                "401":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
                "403":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
                "404":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
            summary: Delete a user account (admin only).
            tags:
                - admin
        get:
            operationId: getUser
            parameters:
                - description: Numeric user identifier.
                  in: path
                  name: userID
                  required: true
                  type: string
            responses:
                "200":
                    description: Users
                    schema:
                        $ref: '#/definitions/Users'
                "401":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
                "403":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
                "404":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
            summary: Fetch a single user account (admin only).
            tags:
                - admin
        put:
            operationId: updateUser
            parameters:
                - description: Numeric user identifier.
                  in: path
                  name: userID
                  required: true
                  type: string
                - description: User fields to update.
                  in: body
                  name: Body
                  required: true
                  schema:
                    $ref: '#/definitions/UpdateUserPayload'
                    description: User fields to update.
                    type: object
            responses:
                "200":
                    description: Users
                    schema:
                        $ref: '#/definitions/Users'
                "400":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
                "401":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
                "403":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
                "404":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
            summary: Update a user account (admin only).
            tags:
                - admin
    /auth/login:
        post:
            operationId: login
            parameters:
                - description: Login credentials.
                  in: body
                  name: Body
                  required: true
                  schema:
                    $ref: '#/definitions/PasswordLoginParams'
                    description: Login credentials.
                    type: object
            responses:
                "200":
                    description: JWTResponse
                    schema:
                        $ref: '#/definitions/JWTResponse'
                "400":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
                "401":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
            summary: Exchange username/email and password for a JWT token.
            tags:
                - auth
    /first-run:
        post:
            description: |-
                Bootstrap the installation by creating the initial superuser. Only succeeds
                while the instance has no superuser; every subsequent call returns 409.
            operationId: firstRun
            parameters:
                - description: Initial superuser.
                  in: body
                  name: Body
                  required: true
                  schema:
                    $ref: '#/definitions/NewUserParams'
                    description: Initial superuser.
                    type: object
            responses:
                "200":
                    description: Users
                    schema:
                        $ref: '#/definitions/Users'
                "400":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
                "409":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
            tags:
                - system
    /labels:
        get:
            operationId: listLabels
            responses:
                "200":
                    description: LabelVocabulary
                    schema:
                        $ref: '#/definitions/LabelVocabulary'
                "401":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
            summary: The label vocabulary visible to the caller, with usage counts.
            tags:
                - labels
    /labels/{labelID}:
        delete:
            operationId: deleteLabel
            parameters:
                - description: Numeric label identifier.
                  in: path
                  name: labelID
                  required: true
                  type: string
            responses:
                "200":
                    $ref: '#/responses/OK'
                "401":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
                "404":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
            summary: Delete a label owned by the caller.
            tags:
                - labels
        put:
            operationId: updateLabel
            parameters:
                - description: Numeric label identifier.
                  in: path
                  name: labelID
                  required: true
                  type: string
                - description: Label fields to update.
                  in: body
                  name: Body
                  required: true
                  schema:
                    $ref: '#/definitions/UpdateLabelParams'
                    description: Label fields to update.
                    type: object
            responses:
                "200":
                    description: LabelInfo
                    schema:
                        $ref: '#/definitions/LabelInfo'
                "400":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
                "401":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
                "404":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
            summary: Rename a label or change its custom color.
            tags:
                - labels
    /labels/mine:
        get:
            operationId: listOwnedLabels
            responses:
                "200":
                    description: LabelInfoArray
                    schema:
                        $ref: '#/definitions/LabelInfoArray'
                "401":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
            summary: Labels owned by the caller.
            tags:
                - labels
    /logout:
        get:
            operationId: logout
            responses:
                "200":
                    $ref: '#/responses/OK'
            summary: Blacklist the caller's current JWT token, ending the session.
            tags:
                - auth
    /me:
        get:
            operationId: getMe
            responses:
                "200":
                    description: Users
                    schema:
                        $ref: '#/definitions/Users'
                "401":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
            summary: The account record of the authenticated caller.
            tags:
                - users
        put:
            operationId: updateMe
            parameters:
                - description: Settings to update.
                  in: body
                  name: Body
                  required: true
                  schema:
                    $ref: '#/definitions/MeSettingsParams'
                    description: Settings to update.
                    type: object
            responses:
                "200":
                    description: Users
                    schema:
                        $ref: '#/definitions/Users'
                "400":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
                "401":
                    description: APIErrorResponse
                    schema:
                        $ref: '#/definitions/APIErrorResponse'
            summary: Update the caller's own settings.
            tags:
                - users
    /paste:
        get:
            description: |-
                List pastes visible to the caller, filtered by the optional query
                parameters.
            operationId: listPastes
            parameters:
                - description: Page number, starting at 1.
                  in: query
                  name: page
                  type: integer
                - description: Maximum results per page.
                  in: query
                  name: max_results
                  type: integer
                - description: Restrict the listing to a scope (e.g. user or team).
                  in: query
                  name: scope
                  type: string
                - description: Restrict the listing to a single team.
                  in: query
                  name: team
                  type: string

            - name
            - owner
    UpdateLabelParams:
        type: object
        properties:
            name:
                type: string
            color:
                type: string
    UpdatePasteParams:
        type: object
        properties:
            public:
                type: boolean
        required:
            - public
    UpdateTeamParams:
        type: object
        properties:
            name:
                type: string
            description:
                type: string
    UpdateUserPayload:
        type: object
        properties:
            is_admin:
                type: boolean
            username:
                type: string
            password:
                type: string
            full_name:
                type: string
            enabled:
                type: boolean
            email:
                type: string
            discoverable:
                type: boolean
    UserActionRequest:
        type: object
        properties:
